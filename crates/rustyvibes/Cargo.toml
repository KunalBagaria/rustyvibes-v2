[package]
name = "rustyvibes"
description = "Mechanical keyboard sounds for every key press — a native macOS menu bar app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
block2 = "0.6.2"
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSResponder",
    "NSRunningApplication",
    "NSSlider",
    "NSStackView",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSSwitch",
    "NSText",
    "NSTextField",
    "NSUserInterfaceLayout",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSTimer",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
] }
rvpack = { path = "../rvpack" }

[lints]
workspace = true
